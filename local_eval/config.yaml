# PRIME local-model experiment config. Every model here is ungated on Hugging Face,
# so nothing needs a token. Swap models freely; the run records what was used.

generator:                 # the model PRIME is protecting; weak refusals on purpose
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  base_url: http://localhost:8001/v1
  max_tokens: 512
  temperature: 0.0

judge:                     # PRIME's risk judge (replaces Gemini 2.5 Flash Lite)
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  base_url: http://localhost:8002/v1
  max_tokens: 400
  temperature: 0.0

grader:                    # independent scorer of final outputs; must not be PRIME's judge
  model: OPEN_DECISION     # see README "Open decisions"
  base_url: http://localhost:8003/v1
  max_tokens: 10

policy:                    # same shape as Shubham's config.py, now fully enforced
  mode: LOOSE              # LOOSE or STRICT; picks the thresholds below
  thresholds:              # score >= high -> REFUSE; score >= medium -> REWRITE
    LOOSE:  {high: 0.7, medium: 0.3}    # Shubham's values
    STRICT: {high: 0.5, medium: 0.15}   # my choice; his code never defined Strict values
  fail_closed: true        # judge error -> treat as REFUSE, but it is counted separately
  topics:                  # his sensitive_topics (defined but never read in his code)
    Competitors:
      action: REFUSE
      instruction: Do not discuss specific competitors (e.g., Apple, OpenAI). Reply generally.
    Mental Health:
      action: REWRITE
      instruction: Provide a supportive, non-clinical response. Include a helpline disclaimer.
    Geopolitical:
      action: REFUSE
      instruction: Decline to comment on active geopolitical conflicts.

run:
  concurrency: 8
  datasets: [harmbench, xstest]
  limit: null              # e.g. 20 for a quick smoke run
