# PRIME local-model experiment config. Every model here is ungated on Hugging Face,
# so nothing needs a token. Swap models freely; the run records what was used.

# Three LLMs, named after PRIME's letters:
#   protected model (generator) - the model PRIME guards
#   risk_sensor (R, and I)      - scores each request; also runs the Intervention step
#   evaluator (E)               - compares model-alone vs PRIME answers; outside the guarded path
# All three are different model families.
generator:                 # the model PRIME is protecting; chosen because it does NOT refuse much on its own
  model: TheBloke/zephyr-7B-beta-AWQ   # Mistral-based; HarmBench paper: complies with most direct requests
  base_url: http://localhost:8001/v1
  max_tokens: 512
  temperature: 0.0
  serve: {gpu_memory: 0.40, max_model_len: 2048, chat_template: infra/zephyr-chat-template.jinja}

risk_sensor:               # R: PRIME's risk sensor (risk.py); its model also runs I
  type: llm                # llm (prompted, below) | label | probability (trained guards, Phase 2)
  guided_json: false       # vLLM guided decoding; off: ~100 s/call on vLLM 0.9.2 + T4 in M0c (parse errors are retried)
  examples: prompts/risk_examples.csv   # versioned, self-authored few-shot examples (low / medium / high pairs)
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  base_url: http://localhost:8002/v1
  max_tokens: 400
  temperature: 0.0
  serve: {gpu_memory: 0.48, max_model_len: 2048}

evaluator:                 # E: evaluator LLM, blind A/B comparison of model-alone vs PRIME answers (evaluate.py).
                           # Must differ from the risk sensor and the protected model. Any
                           # OpenAI-compatible endpoint; api_key_cmd prints a key or token.
  # Llama 4 Maverick via Vertex AI's managed API: a different family from both, and the managed
  # Llama 4 endpoint runs no Llama Guard filter in front of the model.
  model: meta/llama-4-maverick-17b-128e-instruct-maas
  base_url: https://us-east5-aiplatform.googleapis.com/v1/projects/afshaan-trial-1/locations/us-east5/endpoints/openapi
  api_key_cmd: gcloud auth print-access-token
  max_tokens: 600
  concurrency: 8

policy:                    # P: the one declarative policy every module reads (docs/RISK_SENSOR_REDESIGN.md)
  name: general            # the general-purpose policy; industry-specific policies are backlog (DECISIONS Q20)
  # The risk sensor (R) reports a level (low / medium / high) and a category; this table turns them into an action.
  # STRICT: clearly unsafe requests stop with a canned refusal (no model call). LOOSE: they are rewritten
  # instead (a "safe completion"), except in always_refuse categories.
  mode: STRICT             # STRICT or LOOSE
  actions:
    STRICT: {low: ALLOW, medium: REWRITE, high: REFUSE}
    LOOSE:  {low: ALLOW, medium: REWRITE, high: REWRITE}
  always_refuse:           # the floor: at HIGH risk these are refused in every mode (rewriting them launders the request)
    - Child sexual exploitation
    - Mass-casualty weapons
  on_sensor_error: REFUSE  # what the user gets if the risk sensor fails (REFUSE or ALLOW). Recorded as an error, never as a risk level
  refusal: template        # template: the category's canned refusal, no model call | generated: an LLM writes it (ablation)
  # One definition of harm, read by R (to judge the level), the rewrite step (what to remove, what to aim for)
  # and REFUSE (canned text). Harm categories: unsafe / borderline / safe. Topics: `about` (handled by `topics`).
  # Written for PRIME, deliberately in general terms; tests/test_policy.py checks it doesn't copy benchmark prompts.
  categories:
    Violence:
      unsafe: Real help to physically hurt, kill or threaten a real person, or to be cruel to an animal, or to make, obtain or use a weapon to harm someone.
      borderline: General information about weapons, self-defence, dangerous activities or how violent crimes are investigated; violent fiction that asks for real-world operational detail.
      safe: Words for violence or destruction used in a non-violent sense (computing, sport, cooking, pest control, demolition, figures of speech); violence inside video games or fiction with no real target; history, news and definitions.
      refusal: I can't help with anything meant to hurt someone. If you or someone else is in danger, please contact local emergency services.
    Mass-casualty weapons:
      unsafe: Real help to make, obtain, enhance or deploy chemical, biological, radiological or nuclear weapons, or explosives meant to harm many people.
      borderline: How such weapons work in general terms, their effects, treaties and history, when the request seeks more technical depth than understanding needs.
      safe: History, policy, arms-control debates, public-health and emergency-preparedness information.
      refusal: I can't help with weapons that could harm many people. I'm happy to talk about the history, policy or safety side of the topic.
    Sexual:
      unsafe: Explicit sexual content, or non-consensual sexual content involving adults.
      borderline: Romantic or suggestive writing; frank questions about sex that drift toward explicit description.
      safe: Sexual health, consent, relationships and sex education.
      refusal: I can't write that sexual content. I'm happy to help with questions about relationships, consent or sexual health.
    Child sexual exploitation:
      unsafe: Any sexual or sexualised content involving minors, or help to contact, groom or exploit a child.
      borderline: none; anything sexual involving a minor is unsafe.
      safe: Child-safety education for parents and educators; how to recognise and report abuse.
      refusal: I can't help with that. If a child may be at risk, contact local police or a child-protection hotline (in the US, the Childhelp line at 1-800-422-4453).
    Illegal:
      unsafe: Meaningful help committing crimes such as fraud, scams, phishing, hacking into systems or accounts, theft, making or selling illegal drugs, money laundering, evading police.
      borderline: How a scam, attack or crime works in general terms, for awareness or defence; legal grey areas; security questions where the intent is unclear.
      safe: Legal information, crime prevention, cybersecurity defence, news and history of crimes.
      refusal: I can't help with that because it could involve breaking the law. If you're dealing with a legal situation, a lawyer or the relevant authority can advise you.
    Self-harm:
      unsafe: Methods, encouragement or instructions for hurting or killing oneself, or for hiding self-harm or disordered eating.
      borderline: Questions about suicide or self-harm that do not seek methods; a person who may be at risk; medication or overdose questions with unclear intent.
      safe: Definitions, statistics, warning signs, how to support someone, recovery resources.
      refusal: I can't help with that, but I don't want you to go through this alone. If you're thinking about hurting yourself, please call or text 988 (in the US) or your local crisis line.
    Hate:
      unsafe: Content that demeans, dehumanises or attacks people for a protected characteristic (race, ethnicity, religion, gender, sexuality, disability and similar); slurs; praise or denial of genocide; extremist propaganda.
      borderline: Questions about stereotypes or group differences asked to understand them; requests to argue one side of a contested social debate.
      safe: History and education about persecution and discrimination; neutral questions that mention a group; "discrimination" against things that are not people or not real.
      refusal: I can't write content that demeans people for who they are. I'm happy to help with a respectful take on the topic.
    Privacy:
      unsafe: Finding, exposing or misusing a real private person's personal information (identity numbers, home address, accounts, medical records), or tracking someone without consent.
      borderline: Searching for a named person whose public status is unclear; questions about collecting personal data at scale.
      safe: Public facts about public figures; fictional characters; advice on protecting one's own privacy.
      refusal: I can't help find, expose or misuse someone's private information. I can explain how to protect your own privacy instead.
    Other:
      unsafe: Other real-world harm, such as defamation of real people, dangerous misinformation presented as fact, or harassment of a specific person.
      borderline: Persuasive writing on health, science or political claims that could mislead; criticism of a real person that may cross into false claims.
      safe: Fact-checking, balanced explanations, satire clearly marked as such.
      refusal: I can't help with that, but I'm happy to help with a related question.
    Competitors:
      about: Specific competitor companies or their products.
      refusal: I can't discuss specific competitors, but I'm happy to talk about the topic in general.
    Mental Health:
      about: A person describing emotional distress, or asking for help with their mental health.
      refusal: I'm sorry you're dealing with this. I can't give clinical advice, but talking to someone you trust or a professional can help (in the US, call or text 988 any time).
    Geopolitical:
      about: Taking sides on an active geopolitical conflict.
      refusal: I can't comment on active geopolitical conflicts, but I can share neutral background on the region or its history.
  topics:                  # per-topic rules: apply at any level, and can only make the action stricter
    Competitors:
      action: REFUSE
      instruction: Do not discuss specific competitors (e.g., Apple, OpenAI). Reply generally.
    Mental Health:
      action: REWRITE
      instruction: Provide a supportive, non-clinical response. Include a helpline disclaimer.
    Geopolitical:
      action: REFUSE
      instruction: Decline to comment on active geopolitical conflicts.

monitoring:                # M: one record per interaction, batched to the bucket; BigQuery reads it (docs/MONITORING.md)
  enabled: true
  sink: gcs                # gcs or local. Mock runs write locally unless PRIME_MONITOR_SINK=gcs
  gcs_prefix: gs://afshaan-trial-1-prime-results/monitoring
  local_dir: results/monitoring   # also where records go if a GCS write fails
  source: v1               # tag on every record (e.g. pilot, v1, prod); mock runs are always "test"
  flush_every: 20          # write a file every 20 records...
  flush_seconds: 60        # ...or once the oldest buffered record is 60 s old
  console: true            # one [M] line per request
  bq_dataset: prime_monitoring    # infra/setup-monitoring.sh; project is infra.project

run:
  concurrency: 1           # one request at a time; plenty for small batches, lowest memory
  datasets: [harmbench, xstest]
  limit: null              # e.g. 20 for a quick smoke run

# Where experiments run. infra/create-gpu-vm.sh reads this, tries each GPU type in each
# region in order (Google picks a zone with capacity), and records what it got in infra/vm.env.
infra:
  project: afshaan-trial-1
  vm_name: prime-lab-t4
  gpu_types: [nvidia-tesla-t4]          # tried in order; e.g. [nvidia-tesla-t4, nvidia-l4]
  provisioning: [standard, spot]        # tried in order; spot = spare-capacity pool, ~60-70% cheaper,
                                        # Google may stop it at short notice (it is stopped, not deleted)
  machine_types:                        # host machine for each GPU type
    nvidia-tesla-t4: n1-standard-4      # 4 vCPU, 15 GB RAM, attach 1x T4 (16 GB)
    nvidia-l4: g2-standard-4            # L4 comes built in
  regions: [us-central1, us-east1, us-east4, us-west1, us-west2, us-west3, us-west4]   # US only
  disk_gb: 100
  max_hours: 8                          # VM stops itself this long after each start
  idle_minutes: 60                      # ...and after this long with GPU and CPU idle
  results_bucket: afshaan-trial-1-prime-results
